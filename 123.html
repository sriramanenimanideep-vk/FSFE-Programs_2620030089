<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .tight {
            line-height: 15;
        }

        .loose {
            line-height: 1.8;
        }

        .light {
            font-weight: 300;
        }

        .bold {
            font-weight: 700;
        }
    </style>
</head>

<body>
    <p class="tight">This paragraph has a tight line height.</p>

    <p class="loose">This paragraph has a loose line height.</p>

    <p class="light">This paragraph has a light font weight.</p>

    <p class="bold">This paragraph has a bold font weight.</p>

</html>
</body>
